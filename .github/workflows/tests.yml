# Runs the tests automatically on GitHub every time code is pushed.
name: Tests

# WHEN to run: on every push to main, on every pull request,
# and by hand from the "Actions" tab (workflow_dispatch).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Job 1: the fast tests. No database and no Docker needed.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Download the code
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Run the unit tests
        run: ./mvnw -B -Dtest='*UnitTest' test

  # Job 2: the integration tests. They start a temporary PostgreSQL
  # in Docker (Testcontainers). GitHub's Linux machines already have Docker.
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: unit-tests # only start if the unit tests passed
    steps:
      - name: Download the code
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Run the integration tests
        run: ./mvnw -B -Dtest='**/integration/*Test' test

  docker-image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
