spring.application.name=university-management-system
spring.config.import=optional:file:.env[.properties]
spring.profiles.default=demo

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${DB_PORT:15432}/${DB_NAME:ums}}
spring.datasource.username=${DB_USER:ums}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false

server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
# Framework debug output can include request bodies and rejected validation values.
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
