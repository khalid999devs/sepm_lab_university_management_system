<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · University Management</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/styles.css">
    <script type="module" src="/js/login.js"></script>
</head>
<body class="login-page">
    <main class="login-card">
        <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">U</span>University Management</a>
        <div class="login-heading">
            <p class="eyebrow">UNIVERSITY PORTAL</p>
            <h1>Welcome back.</h1>
            <p class="muted">Your courses, people, and university updates in one place.</p>
        </div>
        <p id="login-status" class="notice" role="status" aria-live="polite" hidden></p>
        <form id="login-form">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="username" placeholder="you@university.edu" maxlength="254" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="button primary login-submit" id="sign-in" type="submit">Sign in</button>
        </form>
        <p class="login-footer">Admin · Teacher · Student</p>
    </main>
</body>
</html>
