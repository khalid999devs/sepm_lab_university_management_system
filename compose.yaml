services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-ums}
      POSTGRES_USER: ${DB_USER:-ums}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-ums}
      DB_USER: ${DB_USER:-ums}
      DB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env first}
      PORT: 8080
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:9.18
    profiles: [tools]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-pgadmin-local-demo}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin_data:
